[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "opendpd-tcn-qat"
version = "2.2.0"
description = "OpenDPD fork with native full-I/O causal-TCN QAT and portable RTL export"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Chang Gao", email = "chang.gao@tudelft.nl"},
    {name = "Yizhuo Wu", email = "yizhuo.wu@tudelft.nl"},
    {name = "Ang Li", email = "a.li-2@tudelft.nl"},
]
maintainers = [
    {name = "Chang Gao", email = "chang.gao@tudelft.nl"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.4.0",
    "numpy>=2.0.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
    # Pillow is imported directly for the v2.1 GIF-animation feature
    # (utils/plotting.py). matplotlib pulls it in transitively, but we
    # depend on it explicitly since we import PIL ourselves.
    "pillow>=9.0.0",
    "tqdm>=4.62.0",
    "rich>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black>=21.0",
    "flake8>=3.9",
    # Packaging tools used to build and validate the distribution locally
    # (the same commands run in CI and the publish workflow).
    "build>=1.0",
    "twine>=4.0",
]

[project.urls]
Homepage = "https://github.com/chldjwls85/OpenDPD-TCN-QAT"
Documentation = "https://github.com/chldjwls85/OpenDPD-TCN-QAT/blob/tcn-qat/docs/TCN_QAT_WORKFLOW.md"
Repository = "https://github.com/chldjwls85/OpenDPD-TCN-QAT"
Issues = "https://github.com/chldjwls85/OpenDPD-TCN-QAT/issues"
Upstream = "https://github.com/lab-emi/OpenDPD"

[project.scripts]
opendpd-cli = "opendpd.cli:main"
opendpd-rtl-export = "quant.rtl_cli:export_main"
opendpd-rtl-verify = "quant.rtl_cli:verify_main"
opendpd-rtl-evaluate = "scripts.evaluate_fexlite_integer_pa:main"

[tool.setuptools]
py-modules = ["arguments", "project", "models", "main"]

[tool.setuptools.packages.find]
include = [
    "opendpd",
    "opendpd.*",
    "modules",
    "modules.*",
    "steps",
    "steps.*",
    "utils",
    "utils.*",
    "quant",
    "quant.*",
    "backbones",
    "backbones.*",
    "datasets",
    "datasets.*",
    "scripts",
    "scripts.*"
]

[tool.setuptools.package-data]
datasets = ["*/spec.json", "*/*.csv", "*/*.py"]
quant = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "extended: long-running tests executed only by the scheduled Weekly workflow",
]
